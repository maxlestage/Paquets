# Releases Paquets on its own: once CI is green on master, a version of Cargo.toml
# that has no tag yet gets its tag (v0.1.1 for 0.1.1) and its GitHub release, with
# the notes of its section in CHANGELOG.md, then paquets-macros and paquets are
# published on crates.io. Nothing to fill in by hand: change `version` in
# Cargo.toml and macros/Cargo.toml, write the changelog section, push.
#
# A branch merged by the auto-merge of ci.yml reaches master without starting CI
# there (a push made with GITHUB_TOKEN starts no workflow): the auto-merge then runs
# this workflow itself, with `release`, after the merge.
#
# A release drafted by hand (Releases → Draft a new release) publishes too, and the
# Actions tab runs it by hand (a dry run by default).
#
# Setup: repository secret CARGO_REGISTRY_TOKEN, a crates.io API token with the
# publish-new and publish-update scopes (crates.io → Account Settings → API Tokens).
#
# crates.io only accepts dependencies that are on crates.io: vitesse, securite,
# memoire-orm (with memoire-orm-derive) and active must be published first, each
# from its own repository. Until then the automatic release still tags the version
# and creates its GitHub release, and leaves the publication for later.

name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only check (no publication)"
        type: boolean
        default: true
      release:
        description: "Release the version of master if it has no tag yet (what the auto-merge runs)"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  tag:
    name: Tag the new version
    if: >-
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push') ||
      (github.event_name == 'workflow_dispatch' && inputs.release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      created: ${{ steps.release.outputs.created }}
      sha: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Release the version of Cargo.toml if it is new
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "paquets") | .version')
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "$tag already exists: nothing to release."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The notes: the section of this version in CHANGELOG.md.
          awk -v head="## [$version]" 'index($0, head) == 1 { on = 1; next } on && /^## \[/ { exit } on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "Paquets $version" > notes.md
          fi
          gh release create "$tag" --target "$SHA" --title "$tag" --notes-file notes.md
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "### 🏷️ [$tag]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$tag) released" >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish to crates.io
    needs: tag
    # `needs` skips this job for the other events unless `always()` lets them through.
    if: >-
      always() &&
      (needs.tag.outputs.created == 'true' ||
      (github.event_name != 'workflow_run' && !inputs.release))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: The tag matches the version
        if: github.event_name == 'release'
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "paquets") | .version')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "::error::The tag ($GITHUB_REF_NAME) does not match the version of Cargo.toml ($version): change version in Cargo.toml and macros/Cargo.toml first."
            exit 1
          fi

      # On the automatic release, a missing package or token only postpones the
      # publication; a release drafted by hand stops with an error.
      - name: The four packages are on crates.io
        id: ready
        env:
          AUTOMATIC: ${{ github.event_name == 'workflow_run' || inputs.release }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          missing=""
          for crate in memoire-orm-derive memoire-orm securite vitesse active; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -A "paquets-release (github.com/maxlestage/Paquets)" "https://crates.io/api/v1/crates/$crate")
            if [ "$code" = "200" ]; then
              echo "✓ $crate"
            else
              echo "✗ $crate"
              missing="$missing $crate"
            fi
          done
          if [ -n "$missing" ]; then
            if [ "$AUTOMATIC" = "true" ]; then
              echo "::notice::Released on GitHub; crates.io waits for:$missing (publish them from their own repositories, then run this workflow by hand)."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Publish these packages on crates.io first, from their own repositories (Releases → Draft a new release):$missing"
            exit 1
          fi
          if [ "$AUTOMATIC" = "true" ] && [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::notice::Released on GitHub; add the CARGO_REGISTRY_TOKEN secret to publish on crates.io too."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - if: steps.ready.outputs.ready == 'true'
        run: cargo test --workspace

      - name: Dry run
        if: steps.ready.outputs.ready == 'true' && github.event_name == 'workflow_dispatch' && inputs.dry_run && !inputs.release
        run: |
          cargo publish -p paquets-macros --dry-run
          cargo package -p paquets --list

      - name: Publish
        if: steps.ready.outputs.ready == 'true' && (github.event_name != 'workflow_dispatch' || !inputs.dry_run || inputs.release)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::Add the CARGO_REGISTRY_TOKEN secret (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "paquets-macros") | .version')
          if curl -sf -A "paquets-release (github.com/maxlestage/Paquets)" "https://crates.io/api/v1/crates/paquets-macros/$version" > /dev/null; then
            echo "paquets-macros $version is already on crates.io."
          else
            cargo publish -p paquets-macros
          fi
          cargo publish -p paquets
          echo "### 📦 Published on [crates.io/crates/paquets](https://crates.io/crates/paquets)" >> "$GITHUB_STEP_SUMMARY"
