# Publishes paquets-macros, then paquets, on crates.io when a GitHub release is
# published (from a phone: Releases → Draft a new release → tag v0.1.0 →
# Publish release), or by hand from the Actions tab (a dry run by default).
#
# Setup: repository secret CARGO_REGISTRY_TOKEN, a crates.io API token with the
# publish-new and publish-update scopes (crates.io → Account Settings → API Tokens).
#
# crates.io only accepts dependencies that are on crates.io: vitesse, securite,
# memoire-orm (with memoire-orm-derive) and active must be published first, each
# from its own repository. The first step checks it and says what is missing.

name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only check (no publication)"
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: The tag matches the version
        if: github.event_name == 'release'
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "paquets") | .version')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "::error::The tag ($GITHUB_REF_NAME) does not match the version of Cargo.toml ($version): change version in Cargo.toml and macros/Cargo.toml first."
            exit 1
          fi

      - name: The four packages are on crates.io
        run: |
          missing=""
          for crate in memoire-orm-derive memoire-orm securite vitesse active; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -A "paquets-release (github.com/maxlestage/Paquets)" "https://crates.io/api/v1/crates/$crate")
            if [ "$code" = "200" ]; then
              echo "✓ $crate"
            else
              echo "✗ $crate"
              missing="$missing $crate"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Publish these packages on crates.io first, from their own repositories (Releases → Draft a new release):$missing"
            exit 1
          fi

      - run: cargo test --workspace

      - name: Dry run
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: |
          cargo publish -p paquets-macros --dry-run
          cargo package -p paquets --list

      - name: Publish
        if: github.event_name == 'release' || !inputs.dry_run
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::Add the CARGO_REGISTRY_TOKEN secret (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "paquets-macros") | .version')
          if curl -sf -A "paquets-release (github.com/maxlestage/Paquets)" "https://crates.io/api/v1/crates/paquets-macros/$version" > /dev/null; then
            echo "paquets-macros $version is already on crates.io."
          else
            cargo publish -p paquets-macros
          fi
          cargo publish -p paquets
          echo "### 📦 Published on [crates.io/crates/paquets](https://crates.io/crates/paquets)" >> "$GITHUB_STEP_SUMMARY"
