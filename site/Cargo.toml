[package]
name = "paquets-site"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "The website and documentation hub of Paquets, written in Rust with Yew (WebAssembly)."

# Standalone crate: not part of the Paquets build (the root Cargo.toml excludes `site`).
[workspace]

[dependencies]
yew = { version = "0.23", features = ["csr"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
# The same versions as the ones yew already depends on (no duplicate code in the .wasm).
gloo-timers = "0.3"
gloo-events = "0.2"
wasm-bindgen-futures = "0.4"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
web-sys = { version = "0.3", features = [
  "CssStyleDeclaration",
  "Document",
  "DomRect",
  "DomTokenList",
  "Element",
  "EventTarget",
  "HtmlElement",
  "HtmlInputElement",
  "KeyboardEvent",
  "Location",
  "Response",
  "ScrollBehavior",
  "ScrollIntoViewOptions",
  "ScrollLogicalPosition",
  "ScrollToOptions",
  "Storage",
  "IntersectionObserver",
  "IntersectionObserverEntry",
  "IntersectionObserverInit",
  "MediaQueryList",
  "MouseEvent",
  "Navigator",
  "Clipboard",
  "NodeList",
  "Window",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
