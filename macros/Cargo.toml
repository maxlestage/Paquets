[package]
name = "paquets-macros"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Attribute macros (#[model], #[data]) for the Paquets full-stack framework."
authors = ["Maxime Nathan Lestage"]
license-file = "../LICENSE"
homepage = "https://paquets-90dfc06b6fea.herokuapp.com/"
repository = "https://github.com/maxlestage/Paquets"
documentation = "https://docs.rs/paquets"
readme = "README.md"
keywords = ["web", "framework", "fullstack", "orm", "macro"]
categories = ["web-programming", "development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
