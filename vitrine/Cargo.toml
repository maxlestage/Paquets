[package]
name = "orbite"
version = "0.1.0"
edition = "2024"
publish = false
license-file = "../LICENSE"
description = "Orbite, un site vitrine complet écrit avec Paquets : pages SEO, PWA, scènes 3D en WebAssembly et animations."

# Projet autonome : il ne fait pas partie de la compilation de Paquets.
[workspace]

# Un seul crate, deux cibles : le serveur (src/main.rs) et, compilés en WebAssembly,
# les îlots et les scènes 3D (src/lib.rs).
[lib]
name = "orbite"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "orbite"
path = "src/main.rs"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
paquets = { path = ".." }

[target.'cfg(target_arch = "wasm32")'.dependencies]
paquets = { path = "..", default-features = false, features = ["client"] }
wasm-bindgen = "=0.2.129"
web-sys = { version = "0.3", features = ["DomRect", "DomTokenList", "Element", "EventTarget", "MediaQueryList", "Performance", "PointerEvent", "Window"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Le bundle du navigateur, le plus petit possible.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
